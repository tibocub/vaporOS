[board]
name = rp2040-bench-wren
description = RP2040-Zero image for the langbench scripting-VM benchmark: Wren under test (no stock lua/vlua)
extends = rp2040-zero
runner = rp2040-uf2

[features]
-lua
bench

[config]
CONFIG_VAPOROS_VBENCH_WREN=y
# Wren's compiler recurses with large per-level structs (it compiles its core library at startup); the default
# 16 KB task stack overflowed on the first run and took the USB console with it.
CONFIG_VAPOROS_VBENCH_STACKSIZE=32768
