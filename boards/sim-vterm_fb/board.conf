[board]
name = sim-vterm_fb
description = Simulator with vaporOS's own graphical terminal (vterm_fb) on an X11 framebuffer
extends = sim-nsh
nuttx_config = sim:nx11
aliases = vterm_fb
runner = sim

[hardware]
screen = display/sim-framebuffer width=800 height=600

[config]
CONFIG_EXAMPLES_NX=n
CONFIG_INIT_ENTRYPOINT="vterm_fb_main"
CONFIG_VAPOROS_VTERM_FB=y
CONFIG_NSH_READLINE=y
CONFIG_PSEUDOTERM=y
CONFIG_BOARDCTL_POWEROFF=y
