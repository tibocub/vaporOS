[board]
name = sim-nxterm
description = Simulator with an NxTerm window (X11)
extends = sim-nsh
nuttx_config = sim:nx11
aliases = nxterm
runner = sim

[config]
CONFIG_EXAMPLES_NX=n
CONFIG_NXTERM=y
CONFIG_EXAMPLES_NXTERM=y
CONFIG_INIT_ENTRYPOINT="nxterm_main"
# CLE (NSH's default line editor) assumes a full VT100 terminal; NxTerm's own
# VT100 support is minimal. NSH_READLINE avoids that.
CONFIG_NSH_READLINE=y
