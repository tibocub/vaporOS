[board]
name = rv-virt
description = NuttX rv-virt: 64-bit RISC-V on QEMU "virt" (32 MB RAM, 16550 UART); vaporshell on the console. The target for running vaporOS in a browser.
nuttx_config = rv-virt:nsh64
aliases = riscv
runner = qemu-riscv

[patches]
lua-32bit-typo.patch
lua-maxccalls.patch
lua-progname.patch
vfs-stat-zero-mountpoint.patch

[tools]
# Any RISC-V GCC works; NuttX prefers xPack's riscv-none-elf- and falls back to riscv64-unknown-elf-.
# Fedora's riscv64-linux-gnu- is a Linux-targeted GCC, fine for NuttX's freestanding build.
env.CROSSDEV = ${CROSSDEV:-riscv64-linux-gnu-}
require = riscv64-linux-gnu-gcc qemu-system-riscv64

[features]
base
readline-ux
tty-signals
observability
lua
vi
vaporui
demos

[hardware]
console = console/uart tty=/dev/console
scratch = storage/tmpfs mount=/tmp

[config]
# vinit mounts the builtin apps on /bin and starts vaporshell with posix_spawnp, which searches $PATH.
# rv-virt:nsh64 ships PATH=/system/bin (a ROMFS it doesn't have here), the sim's base config uses /bin: without
# this vinit prints "cannot start vaporshell" forever.
CONFIG_LIBC_ENVPATH=y
CONFIG_PATH_INITIAL="/bin"

# vlua needs more than the 24 KB a small board gives it (a REPL plus nested pcalls); there is 32 MB of RAM here.
# Same values as the sim; RISC-V frames are smaller than the sim's x86-64 ones, so this is generous.
CONFIG_VAPOROS_VLUA_STACKSIZE=262144
CONFIG_INTERPRETERS_LUA_MAXCCALLS=40

# The system tick: rv-virt:nsh64 ships 1 kHz. Every tick is an interrupt the emulator has to deliver, and an idle
# guest still takes all of them (measured: QEMU at 27% of a core idling at the prompt natively, and far worse in the
# browser, where each wakeup also crosses threads). 100 Hz is the usual NuttX default and plenty for a shell.
CONFIG_USEC_PER_TICK=10000
