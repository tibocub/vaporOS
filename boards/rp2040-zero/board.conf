[board]
name = rp2040-zero
description = Waveshare RP2040-Zero (2 MB flash, 264 KB SRAM); vaporshell on a USB CDC-ACM console, no NSH
nuttx_config = waveshare-rp2040-zero:usbnsh
aliases = rp2040
runner = rp2040-uf2

# NuttX changes this board needs; each has its rationale in its header and in
# patches/UPSTREAM.md. They are applied to ../nuttx by setup.sh.
[patches]
lua-32bit-typo.patch
lua-maxccalls.patch
lua-progname.patch
rp2040-uf2-family.patch
rp2040-reset-bootsel-watchdog.patch
rp2040-flash-littlefs.patch
rp2040-crashdump-waveshare.patch
rp2040-usbdev-w1c-and-watchdog.patch
cdcacm-tx-ring-race.patch
cdcacm-reset-on-1200bps.patch
vfs-stat-zero-mountpoint.patch

[tools]
# Arm GNU toolchain, picotool and a pico-sdk checkout (NuttX builds the RP2040
# second-stage bootloader from it; without boot2 the bootrom rejects the image
# and the board just stays in BOOTSEL). Defaults point at ~/toolchains; the
# environment variables override them.
path = ${ARM_TOOLCHAIN_BIN:-~/toolchains/arm-gnu/*/bin}
path = ${PICOTOOL_DIR:-~/toolchains/picotool/picotool}
env.PICO_SDK_PATH = ${PICO_SDK_PATH:-~/toolchains/pico-sdk}
require = arm-none-eabi-gcc picotool

[features]
base
readline-ux
tty-signals
lua
lua-libs
vi
observability

[hardware]
console = console/usb-cdcacm tty=/dev/ttyACM0
storage = storage/flash-littlefs offset=0x100000 mount=/flash
watchdog = system/watchdog-reset timeout_ms=4000
crash = system/crash-record-sram ram_size=261888

[config]
# 2 KB lines would be wasted RAM here.
CONFIG_LINE_MAX=256

# Lua allows 200 nested C calls (pcall in pcall, ...) by default; each level costs ~480 bytes of stack here
# (measured through /proc/self/stack on Lua 5.4.0) and vlua has 24 KB, so 200 overflows it silently
# (patches/nuttx-apps/lua-maxccalls.patch). Re-measure when the stack size or Lua version changes.
CONFIG_INTERPRETERS_LUA_MAXCCALLS=40
# System-wide Lua libraries live on the persistent flash filesystem.
CONFIG_VAPOROS_VLUA_LIBDIR="/flash/lib/lua"
# libc keeps one time-zone table (370 transitions x 20 types, ~5 KB) after the first localtime()/mktime()/os.date,
# for good. With no zoneinfo files on this board it only ever holds UTC, so shrink it.
CONFIG_LIBC_TZ_MAX_TIMES=16
CONFIG_LIBC_TZ_MAX_TYPES=4
