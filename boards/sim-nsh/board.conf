[board]
name = sim-nsh
description = NuttX simulator (runs as a normal Linux process); NSH starts vaporshell
nuttx_config = sim:nsh
aliases = nsh
runner = sim

[patches]
vfs-stat-zero-mountpoint.patch

[features]
base
readline-ux
tty-signals
lua
lua-libs
vi
observability
elf-loading
demos

[hardware]
host-files = storage/hostfs

[config]
# The sim has plenty of RAM; a long line is nicer than a short one.
CONFIG_LINE_MAX=1024
# The sim is built with host coverage tooling off (it only slows the build).
CONFIG_COVERAGE_NONE=y
CONFIG_COVERAGE_ALL=n
CONFIG_COVERAGE_TOOLCHAIN=n
# History sized generously: the sim is not memory constrained, so these are
# not the small-device defaults.
# (Only used by NSH and vlua; vaporshell has its own editor and history.)
CONFIG_READLINE_CMD_HISTORY_LEN=64
CONFIG_READLINE_CMD_HISTORY_LINELEN=128
