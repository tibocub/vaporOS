[hardware]
type = network
description = The simulator's TCP/IP goes through the host's own network stack (usrsock); no TAP device, no root
status = verified
verified_on = sim-nsh

[config]
CONFIG_NET=y
CONFIG_NET_TCP=y
CONFIG_NET_USRSOCK=y
# the sim's own transport (sim_usrsock.c, with its event loop); the default /dev/usrsock device never starts it
CONFIG_NET_USRSOCK_DEVICE=n
CONFIG_NET_USRSOCK_CUSTOM=y
# without these the sockets silently use NuttX's own (absent) stack: connect() is refused
CONFIG_NET_USRSOCK_TCP=y
CONFIG_NET_USRSOCK_UDP=y
CONFIG_NET_UDP=y
# the syscall table (elf loading) lists getsockopt and the sim needs it to link
CONFIG_NET_SOCKOPTS=y
CONFIG_SIM_NETUSRSOCK=y
CONFIG_MM_IOB=y
# NuttX's DNS client sends its queries as UDP through usrsock; the server is a fixed address (no DHCP in the sim)
CONFIG_LIBC_NETDB=y
CONFIG_NETDB_DNSCLIENT=y
CONFIG_NETDB_DNSSERVER_IPv4=y
CONFIG_NETDB_DNSSERVER_IPv4ADDR=0x08080808
CONFIG_VAPOROS_VLUA_SOCKET=y
