[hardware]
type = storage
description = SD card on an SPI bus (boot/root filesystem from a card)
status = draft

[params]
# Which SPI controller and the four pins it is wired to. There is no default:
# every device wires these differently.
spi_bus =
sck =
mosi =
miso =
cs =
# SPI clock while talking to the card.
freq_hz = 20000000
mount = /sd

[config]
# NOT YET WIRED. The options below are the generic NuttX side. The pins cannot
# be set from Kconfig on most boards (they live in board C code), so they need
# the vaporOS board-glue layer described in hardware/README.md before this can
# move out of `draft`.
CONFIG_SPI=y
CONFIG_MMCSD=y
CONFIG_MMCSD_SPI=y
CONFIG_MMCSD_SPICLOCK=${freq_hz}
CONFIG_FS_FAT=y
