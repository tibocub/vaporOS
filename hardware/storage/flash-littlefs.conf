[hardware]
type = storage
description = LittleFS on a fixed region of the on-chip flash, mounted read/write
status = verified
verified_on = rp2040-zero

[params]
# Start of the region, from the beginning of flash. The firmware image must end
# below it. Fixed (not "after the image") so that reflashing leaves files alone.
offset =
mount = /flash

[config]
CONFIG_MTD=y
CONFIG_FS_LITTLEFS=y
CONFIG_RP2040_FLASH_LITTLEFS=y   # vaporOS patch: rp2040-flash-littlefs.patch
CONFIG_RP2040_FLASH_FS_OFFSET=${offset}
CONFIG_RP2040_FLASH_MOUNT_POINT="${mount}"
