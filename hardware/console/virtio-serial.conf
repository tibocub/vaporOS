[hardware]
type = console
description = virtio-serial console (QEMU virtconsole): the guest hands over whole buffers instead of one UART register write per byte
status = verified
verified_on = rv-virt

[params]
# The port the shell runs on. The first virtio-serial port is /dev/ttyV0; the boot console stays on the board's UART.
tty = /dev/ttyV0
# Bytes per virtqueue buffer: a screen redraw is a few KB, so bigger means fewer exits.
bufsize = 4096

[config]
CONFIG_DRIVERS_VIRTIO=y
CONFIG_DRIVERS_VIRTIO_MMIO=y
# virtio (via OpenAMP) translates physical addresses; a flat build with no MMU uses the identity mapping.
CONFIG_DEV_SIMPLE_ADDRENV=y
CONFIG_DRIVERS_VIRTIO_SERIAL=y
CONFIG_DRIVERS_VIRTIO_SERIAL_BUFSIZE=${bufsize}
CONFIG_VAPOROS_VINIT=y
CONFIG_VAPOROS_VINIT_CDCACM=n
CONFIG_VAPOROS_VINIT_WAIT_HOST=n
CONFIG_VAPOROS_VINIT_TTY="${tty}"
CONFIG_INIT_ENTRYPOINT="vinit_main"
CONFIG_INIT_ENTRYNAME="vinit"
