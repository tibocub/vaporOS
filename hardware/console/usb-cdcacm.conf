[hardware]
type = console
description = USB CDC-ACM serial console; the host sees /dev/ttyACM* (Linux) or a COM port
status = verified
verified_on = rp2040-zero

[params]
# Device node vinit opens once the host has enumerated the gadget.
tty = /dev/ttyACM0
# vinit waits for three Enters before starting the shell: the node opens as soon
# as USB is up, long before a terminal program is attached.
wait_host = y

[config]
CONFIG_VAPOROS_VINIT=y
CONFIG_VAPOROS_VINIT_CDCACM=y
CONFIG_VAPOROS_VINIT_WAIT_HOST=${wait_host}
CONFIG_VAPOROS_VINIT_TTY="${tty}"
CONFIG_INIT_ENTRYPOINT="vinit_main"
# Shown by `ps` as the init task's name.
CONFIG_INIT_ENTRYNAME="vinit"
# readline echoes one byte per write(), so a screenful of editing is a burst of
# tiny USB writes. More/larger CDC-ACM requests gave headroom while chasing a
# console wedge. NOTE: the wedge turned out to be a driver race (patches/nuttx/
# cdcacm-tx-ring-race.patch); whether these are still needed is untested.
CONFIG_CDCACM_NRDREQS=8
CONFIG_CDCACM_NWRREQS=8
CONFIG_CDCACM_RXBUFSIZE=513
CONFIG_CDCACM_TXBUFSIZE=513
# The Arduino "1200 baud touch": setting the line rate to 1200 bps reboots into the boot loader, even if
# every task is hung (patches/nuttx/cdcacm-reset-on-1200bps.patch; tools/rp2040-flash.sh uses it).
CONFIG_CDCACM_RESET_ON_1200BPS=y
