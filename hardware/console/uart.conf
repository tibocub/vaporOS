[hardware]
type = console
description = Plain UART (or other fixed) console; vinit just opens the device and runs the shell
status = untested

[params]
# Device node of the serial port, e.g. /dev/ttyS0 or /dev/console.
tty = /dev/console

[config]
CONFIG_VAPOROS_VINIT=y
CONFIG_VAPOROS_VINIT_CDCACM=n
# A UART is always "attached"; nothing to wait for.
CONFIG_VAPOROS_VINIT_WAIT_HOST=n
CONFIG_VAPOROS_VINIT_TTY="${tty}"
CONFIG_INIT_ENTRYPOINT="vinit_main"
CONFIG_INIT_ENTRYNAME="vinit"
