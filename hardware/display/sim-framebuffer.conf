[hardware]
type = display
description = X11 framebuffer window of the simulator
status = verified
verified_on = sim-vterm_fb

[params]
width = 800
height = 600

[config]
CONFIG_DRIVERS_VIDEO=y
CONFIG_VIDEO_FB=y
CONFIG_SIM_FRAMEBUFFER=y
CONFIG_SIM_FBWIDTH=${width}
CONFIG_SIM_FBHEIGHT=${height}
CONFIG_NXFONTS=y
CONFIG_NXFONT_X11_MISC_FIXED_10X20=y
