[hardware]
type = system
description = Reset on crash and keep a crash record in the top of SRAM (no UART needed to diagnose)
status = verified
verified_on = rp2040-zero

[params]
# SRAM left to the heap. The rest (top 256 bytes on the RP2040) holds the
# record, written by the board's crash handler (patch: rp2040-crashdump.patch)
# and read back with `xd 0x2003ff00 256` after the reset.
ram_size = 261888

[config]
CONFIG_BOARDCTL_RESET=y
CONFIG_BOARD_CRASHDUMP_NONE=n
CONFIG_BOARD_CRASHDUMP_CUSTOM=y
CONFIG_BOARD_RESET_ON_ASSERT=2
# 1 means "enter BOOTSEL" in rp2040_reset.c; 0 is a plain watchdog reset.
CONFIG_BOARD_ASSERT_RESET_VALUE=0
CONFIG_RAM_SIZE=${ram_size}
