[hardware]
type = system
description = Hardware watchdog fed by a kernel worker; resets the chip if the system locks up
status = verified
verified_on = rp2040-zero

[params]
timeout_ms = 4000

[config]
# If the system locks up hard (e.g. a fault inside a fault handler) the board
# resets itself instead of needing a physical replug.
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_AUTOMONITOR=y
CONFIG_WATCHDOG_AUTOMONITOR_BY_WORKER=y
CONFIG_SCHED_WORKQUEUE=y
CONFIG_WATCHDOG_AUTOMONITOR_TIMEOUT=${timeout_ms}
