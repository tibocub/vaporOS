# Third-party Lua C libraries linked into vlua (require("lfs") etc.).
# Sources are unmodified upstream checkouts next to this repo (setup.sh).
[feature]
description = lfs, lpeg and cjson for vlua

[config]
CONFIG_VAPOROS_VLUA_LFS=y
CONFIG_VAPOROS_VLUA_LPEG=y
CONFIG_VAPOROS_VLUA_CJSON=y
# lpeg recurses MAXRULES levels (~45 B each) to find a left-recursive rule; the default 1000 overflows
# the 24 KB vlua stack and resets the board (docs/lua-runtime.md). 200 needs ~9 KB.
CONFIG_VAPOROS_VLUA_LPEG_MAXRULES=200
