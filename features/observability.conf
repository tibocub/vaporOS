# What the coreutils ports of dmesg, ps and top read.
[feature]
description = RAM syslog (dmesg), stack usage (ps) and per-task CPU load (top)

[config]
# The console is not a syslog channel on USB-console boards, so syslog goes to
# a RAM log that dmesg reads. Two channels: the default one plus the RAM log.
CONFIG_RAMLOG=y
CONFIG_RAMLOG_SYSLOG=y
CONFIG_RAMLOG_BUFSIZE=2048
CONFIG_SYSLOG_MAX_CHANNELS=2
CONFIG_SYSLOG_DEVPATH="/dev/kmsg"
# ps: StackUsed column
CONFIG_STACK_COLORATION=y
# top: CPU column (/proc/<pid>/loadavg)
CONFIG_SCHED_CPULOAD_NONE=n
# (SCHED_CPULOAD itself is derived from the clock-source choice, not settable.)
CONFIG_SCHED_CPULOAD_SYSCLK=y
