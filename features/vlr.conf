# vlr, the portable Lua runtime (../vlr): its own Lua 5.4.8, the vapor event scheduler and lfs/lpeg/cjson built in.
# Replaces the `lua` and `lua-libs` features (both bring a second Lua).
[feature]
description = vlr portable Lua runtime with lfs, lpeg and cjson

[config]
CONFIG_VAPOROS_VLR=y
CONFIG_VAPOROS_VLR_LFS=y
CONFIG_VAPOROS_VLR_LPEG=y
CONFIG_VAPOROS_VLR_CJSON=y
CONFIG_VAPOROS_VLR_LPEG_MAXRULES=200
CONFIG_VAPOROS_VLR_LPEG_MAXRECLEVEL=20
CONFIG_LIBC_FLOATINGPOINT=y
# vlr parses and runs in its own task; the default 4 KB is not enough.
CONFIG_VAPOROS_VLR_STACKSIZE=24576
