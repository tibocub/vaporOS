[feature]
description = Small demo/test programs (vhello, portable_wc, portable_cat, vterm test) and compat-scan
[config]
CONFIG_VAPOROS_VHELLO=y
CONFIG_VAPOROS_PORTABLE_WC=y
CONFIG_VAPOROS_PORTABLE_CAT=y
CONFIG_VAPOROS_VTERMTEST=y
# compat-scan (docs/c-posix-compatibility.md): runs on the dev host and on vaporOS itself.
CONFIG_VAPOROS_COMPAT_SCAN=y
