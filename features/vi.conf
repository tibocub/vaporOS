[feature]
description = NuttX's vi work-alike (system/vi) on a VT100 terminal

[requires]
patch termcurses-read-retry.patch   # nuttx-apps: harmless guard, see its header

[config]
CONFIG_SYSTEM_VI=y
# vi cannot query the terminal on a serial console (no TIOCGWINSZ), so the size
# is fixed at build time; 80x24 is what terminal programs default to.
CONFIG_SYSTEM_VI_COLS=80
CONFIG_SYSTEM_VI_ROWS=24
CONFIG_SYSTEM_VI_STACKSIZE=8192
