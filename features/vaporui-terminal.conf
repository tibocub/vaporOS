[feature]
description = terminal widget in vaporUI (libvterm + a pty); needs RAM, not for small boards
[config]
CONFIG_PSEUDOTERM=y
CONFIG_VAPOROS_VAPORUI_TERMINAL=y
# libvterm's call chains overflow the 4 KB default on 64-bit RISC-V: vui_windows froze the moment a Terminal window opened
CONFIG_VAPOROS_VAPORUI_STACKSIZE=16384
