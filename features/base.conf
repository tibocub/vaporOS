# vaporshell + vaporOS-coreutils (tbx) and the NuttX support they need.
# Every vaporOS board includes this.
[feature]
description = vaporshell, tbx (toybox multicall) and the libc/kernel support they rely on

[config]
CONFIG_VAPOROS_VAPORSHELL=y
CONFIG_VAPOROS_TOYBOX=y

# vaporshell and toybox use getenv/setenv/environ. Some NuttX base configs turn
# the environment off (sim:nx11 does), which also silently drops
# LIBC_LOCALTIME below because that depends on it.
CONFIG_DISABLE_ENVIRON=n

# Pipelines (cmd1 | cmd2) need correct exit statuses. Without this NuttX's
# waitpid() can only return a child's status if the child had not already
# exited when waitpid() is called (see the option's own help text). A pipeline
# spawns every stage before waiting on any, so a fast command (`true`) wins the
# race and waitpid() fails outright.
# (It depends on SCHED_HAVE_PARENT. Without that, Kconfig silently drops this
# option: the old RP2040 script "enabled" it for months and it was never on.)
CONFIG_SCHED_HAVE_PARENT=y
CONFIG_SCHED_CHILD_STATUS=y

# One task-local-storage slot per tbx task holds toybox's toys/this/toybuf
# globals (toybox/nuttx-shims/vapor_ctx.h). Without it two applets in a
# pipeline share them and corrupt each other. 1 slot is needed; 4 leaves room.
CONFIG_TLS_TASK_NELEM=4

# POSIX regex (regcomp/regexec) for the toybox applets that match patterns.
# NuttX ships TRE but gates it behind a licence opt-in (fine for an MIT project,
# but it must be asked for). Known gap vs glibc/musl: no REG_STARTEND.
CONFIG_ALLOW_MIT_COMPONENTS=y
CONFIG_LIBC_REGEX=y

# What vaporshell/toybox call into: spawn, pipes, symlinks, locale, errno text, time.
CONFIG_PIPES=y
CONFIG_LIBC_EXECFUNCS=y
CONFIG_PSEUDOFS_SOFTLINKS=y
CONFIG_LIBC_LOCALE=y
CONFIG_LIBC_STRERROR=y
CONFIG_LIBC_LOCALTIME=y
CONFIG_ARCH_SETJMP_H=y

# Some boards do not select these on their own: INTERPRETERS_LUA needs the NSH
# library, and nsh_script.c needs readline declared.
CONFIG_NSH_LIBRARY=y
CONFIG_SYSTEM_READLINE=y

# Builtin apps appear as /bin/<name> (vinit mounts it); vaporshell finds
# commands there. procfs backs free, df, mount, ps, top, uptime.
# BINFS depends on BUILTIN (not every base config has it, e.g. sim:nx11).
CONFIG_BUILTIN=y
CONFIG_FS_BINFS=y
CONFIG_FS_PROCFS=y
CONFIG_FS_PROCFS_REGISTER=y

# Stack sizes. These are properties of the software, not of a board, and the
# NuttX defaults (2 KB) are far too small:
#  - vaporshell recurses for subshells, $(...) and functions;
#  - every toybox applet is its own task. NuttX keeps the task-local-storage
#    block at the BOTTOM of a task's stack, so an overflow shows up as a garbage
#    vapor_ctx() pointer (crash in verror_msg), not as an obvious stack fault.
CONFIG_VAPOROS_VAPORSHELL_STACKSIZE=16384
CONFIG_VAPOROS_TOYBOX_STACKSIZE=8192
CONFIG_DEFAULT_TASK_STACKSIZE=4096
