[feature]
description = Lua (NuttX's interpreter) and vlua, the vaporOS Lua host with a REPL

[config]
CONFIG_INTERPRETERS_LUA=y
# 5.4.0 (NuttX's default) is the first 5.4 release and has a long list of fixed bugs, among
# them stack, GC and lua_settop pointer bugs.
CONFIG_INTERPRETERS_LUA_VERSION="5.4.8"
# 64-bit integers and doubles, like every other Lua: libraries and scripts from the ecosystem assume them
# (float32 loses timestamps and JSON numbers beyond 7 digits). Switch to y only if RAM or speed demand it;
# see patches/nuttx-apps/lua-32bit-typo.patch and docs/lua-runtime.md.
CONFIG_INTERPRETERS_LUA_32BIT=n
# Lua needs libm. The toolchain's libm (LIBM_TOOLCHAIN, the default) is enough;
# CONFIG_LIBM is NuttX's own math library and is not needed.
CONFIG_LIBC_FLOATINGPOINT=y
CONFIG_VAPOROS_VLUA=y
# vlua parses and runs in its own task; the default 4 KB is not enough.
CONFIG_VAPOROS_VLUA_STACKSIZE=24576
