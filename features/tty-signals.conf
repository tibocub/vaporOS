# Ctrl-C on the console kills the foreground task; Ctrl-D stays end-of-file.
# Ctrl-Z (CONFIG_TTY_SIGTSTP) is deliberately NOT enabled: it stops the foreground
# task and vaporshell has no `fg`/`bg` to resume it. (The old scripts spelled the
# option TTY_SIGSTP, which does not exist, so Ctrl-Z was never actually on.)
[feature]
description = Ctrl-C signal character on the console tty

[config]
CONFIG_TTY_SIGINT=y
CONFIG_TTY_SIGINT_CHAR=0x03   # Ctrl-C
