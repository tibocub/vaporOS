# Foundation for "download or compile a program on vaporOS and run it"
# (docs/binary-loading.md): a separately-compiled ELF (MODULE=m) placed on a
# writable filesystem runs by name like any builtin. Additive: it changes
# nothing for apps that are compiled in.
[feature]
description = Load and run separately-built ELF programs
[config]
CONFIG_ELF=y
CONFIG_LIBC_ENVPATH=y
CONFIG_EXECFUNCS_HAVE_SYMTAB=y
CONFIG_EXECFUNCS_SYSTEM_SYMTAB=y
CONFIG_BOARDCTL_APP_SYMTAB=y
