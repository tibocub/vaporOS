# Line editing for the interactive shell: echo, Tab completion (commands and
# paths, through the vaporOS readline_completer() hook), history on the arrows.
[feature]
description = Tab completion and command history in vaporshell
[requires]
patch readline-completer-hook.patch   # nuttx-apps: the completion hook vaporshell registers
patch readline-eof-ctrl-d.patch         # nuttx-apps: Ctrl-D ends input in readline

[config]
CONFIG_READLINE_ECHO=y
CONFIG_READLINE_TABCOMPLETION=y
CONFIG_READLINE_CMD_HISTORY=y
