# NuttX readline for the programs that still use it (NSH, the vlua REPL): echo
# and history on the arrows. vaporshell has its own editor and needs none of this.
[feature]
description = Echo and command history in NuttX readline
[requires]
patch readline-eof-ctrl-d.patch         # nuttx-apps: Ctrl-D ends input in readline

[config]
CONFIG_READLINE_ECHO=y
CONFIG_READLINE_CMD_HISTORY=y
